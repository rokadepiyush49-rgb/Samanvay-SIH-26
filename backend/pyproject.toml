[project]
name = "samanvay-api"
version = "0.1.0"
description = "Samanvay: integrated institution complaint ledger and coordination dashboard for AICTE bureaus and cells"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.162,<0.163",
  "uvicorn[standard]>=0.54,<0.55",
  "sqlalchemy>=2.1.6,<2.2",
  "psycopg[binary]>=3.3.6,<3.4",
  "alembic>=1.20,<1.21",
  "pydantic>=2.14,<2.15",
  "pydantic-settings>=2.16,<2.17",
  "argon2-cffi>=25.1,<26",
  "pyjwt>=2.15,<2.16",
  "cryptography>=50.0,<51",
  "rapidfuzz>=3.14,<3.15",
  "numpy>=2.5,<2.6",
  "openpyxl>=3.1.5,<3.2",
  "reportlab>=5.1,<5.2",
  "python-multipart>=0.0.32,<0.1",
  "anthropic>=1,<2",
]

[project.optional-dependencies]
# Multilingual sentence embeddings for Hindi-English matching (large download; the core works without it).
embeddings = ["sentence-transformers>=6.2,<6.3", "torch>=2.14,<2.15"]
# S3-compatible document storage (MinIO, host object storage).
s3 = ["boto3>=1.43,<1.44"]

[dependency-groups]
dev = [
  "pytest>=9.1,<9.2",
  "hypothesis>=6.170,<7",
  "httpx>=0.28,<0.29",
  "ruff>=0.17,<0.18",
]

# Linux (the Docker images) takes CPU-only torch for the embeddings extra: the CUDA build adds several GB and the
# matcher runs on CPU. macOS keeps the default PyPI wheels.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = [
  "S101",   # asserts are fine in tests
  "S608",   # SQL built only from whitelisted identifiers; values are always bound parameters
  "B008",   # FastAPI Depends() in defaults is the framework idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"app/ml/**" = ["S311"]
"app/ml/synthetic.py" = ["S311", "E501"]  # complaint templates are long data strings
"migrations/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
